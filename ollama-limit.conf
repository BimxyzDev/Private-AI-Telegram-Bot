# ollama-limit.conf
# =====================================================================
# Systemd Drop-In (cgroups v2) - Resource Limit untuk service Ollama
# =====================================================================
# TUJUAN: Ollama (LLM inference) sangat rakus CPU & RAM. Jika dibiarkan
# tanpa batas di server yang JUGA menjalankan Bot Telegram/Web Dashboard
# (mode Single-Server, atau Master Node dengan opsi "Ollama Fallback"
# diaktifkan), Ollama bisa menghabiskan semua resource dan membuat
# proses lain (bot, dashboard) not-responding / OOM-killed oleh kernel.
#
# File ini MEMBATASI service systemd `ollama` ke MAKSIMAL:
#   - 70% dari total CPU yang terpasang (CPUQuota)
#   - 70% dari total RAM fisik (MemoryMax, MemoryHigh sebagai soft-limit)
#
# CARA PASANG (dilakukan otomatis oleh install.sh, tapi bisa manual juga):
#   sudo mkdir -p /etc/systemd/system/ollama.service.d
#   sudo cp ollama-limit.conf /etc/systemd/system/ollama.service.d/limit.conf
#   sudo systemctl daemon-reload
#   sudo systemctl restart ollama
#
# CARA VERIFIKASI batas aktif:
#   systemctl show ollama --property=CPUQuotaPerSecUSec,MemoryMax,MemoryHigh
#   systemd-cgtop   # lihat pemakaian real-time per cgroup
#
# CARA LEPAS batas (kembali ke tanpa batas):
#   sudo rm /etc/systemd/system/ollama.service.d/limit.conf
#   sudo systemctl daemon-reload
#   sudo systemctl restart ollama
#
# CATATAN: Nilai 70% ini adalah PATOKAN (angka statis), bukan otomatis
# menyesuaikan tiap server. install.sh menghitung ulang MemoryMax dalam
# byte sesuai RAM fisik server saat instalasi (lihat fungsi
# apply_ollama_resource_limit) -- file mentah ini memakai contoh untuk
# server dengan 16 GB RAM (70% ~= 11.2G) sebagai fallback jika dipasang
# manual tanpa lewat installer.
# =====================================================================

[Service]
# --- BATAS CPU: maksimal 70% dari SATU core dikali jumlah core terpasang ---
# Contoh: server 8 core -> CPUQuota=700% (70% x 8 core). install.sh mengganti
# nilai ini secara dinamis berdasarkan `nproc` saat instalasi.
CPUQuota=700%

# --- BATAS RAM: hard limit (proses akan di-OOM-kill oleh cgroup jika lewat) ---
# Contoh statis untuk 16 GB RAM (70% = 11.2 GB). install.sh mengganti nilai
# ini dengan hasil perhitungan `MemTotal x 0.7` dari /proc/meminfo saat instalasi.
MemoryMax=11.2G

# --- SOFT LIMIT: kernel akan mulai reclaim memory Ollama lebih agresif begitu
# lewat batas ini, SEBELUM sampai ke MemoryMax (hard limit) di atas -- mencegah
# OOM-kill mendadak, memberi Ollama kesempatan melambat dulu alih-alih mati total.
MemoryHigh=10G

# --- IO & OOM tuning tambahan (opsional tapi disarankan) ---
# Prioritaskan OOM-killer untuk mematikan proses Ollama LEBIH DULU dibanding
# proses Bot/Dashboard lain jika RAM server benar-benar habis total (bukan
# cuma limit cgroup Ollama sendiri yang kena) -- bot & dashboard jauh lebih
# ringan, kematiannya lebih mengganggu UX dibanding Ollama yang bisa retry.
OOMScoreAdjust=500
